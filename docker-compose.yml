version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: inclusive-learning-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-inclusive_admin_2026}
      MONGO_INITDB_DATABASE: inclusive
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
      - ./mongo-init:/docker-entrypoint-initdb.d:ro
    command: --wiredTigerCacheSizeGB 1.5
    networks:
      - inclusive-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/inclusive --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Optional: Uncomment to run the Next.js app in Docker as well
  # app:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #   container_name: inclusive-learning-app
  #   restart: unless-stopped
  #   ports:
  #     - "3005:3005"
  #   environment:
  #     - NODE_ENV=development
  #     - MONGO_URI=mongodb://admin:${MONGO_ROOT_PASSWORD:-inclusive_admin_2026}@mongodb:27017/inclusive?authSource=admin
  #     - JWT_SECRET=${JWT_SECRET}
  #     - OPENAI_API_KEY=${OPENAI_API_KEY}
  #     - SERPER_API_KEY=${SERPER_API_KEY}
  #     - PINECONE_API_KEY=${PINECONE_API_KEY}
  #   depends_on:
  #     mongodb:
  #       condition: service_healthy
  #   volumes:
  #     - .:/app
  #     - /app/node_modules
  #     - /app/.next
  #   networks:
  #     - inclusive-network

volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local

networks:
  inclusive-network:
    driver: bridge
